<style>
/* Layout: full-height garage. 3D stage on top, tool tabs and controls underneath. Dark by design (a lit garage at night). */
:root {
  --bg: #0d0f13;
  --panel: #15181d;
  --raised: #1e2228;
  --line: #2a2f37;
  --ink: #eef0f3;
  --muted: #9aa3ae;
  --accent: #f5be0b;
  --on-accent: #14171b;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; height: 100dvh; }

header {
  display: flex; align-items: center; gap: 10px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.title { flex: 1; min-width: 0; }
.title strong { display: block; font: italic 800 1.35rem/1 var(--display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title span { color: var(--muted); font-size: .8rem; }
.hbtn {
  border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 8px 12px; cursor: pointer;
  font-weight: 600; white-space: nowrap; text-decoration: none; color: var(--ink);
}
.hbtn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }

.stage { position: relative; flex: 1 1 auto; min-height: 240px; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); pointer-events: none;
  background: rgb(0 0 0 / .55); color: #fff; font-size: .8rem; padding: 5px 12px; border-radius: 999px; white-space: nowrap;
  transition: opacity .4s;
}
.badge-type {
  position: absolute; top: 10px; left: max(16px, env(safe-area-inset-left, 0px)); background: rgb(0 0 0 / .5);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: .75rem; color: var(--muted);
}
.toast {
  position: absolute; top: 10px; right: max(16px, env(safe-area-inset-right, 0px)); background: var(--accent); color: var(--on-accent);
  font-weight: 700; font-size: .8rem; padding: 5px 10px; border-radius: 8px; opacity: 0; transition: opacity .3s;
}
.toast.on { opacity: 1; }
.error { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

.panel {
  flex: 0 0 auto; max-height: 46dvh; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 8px;
  scrollbar-width: none; flex: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 0; background: var(--raised); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.groups { overflow-y: auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.group { display: none; gap: 14px; }
.group.on { display: grid; }
.field { display: grid; gap: 7px; }
.field > span { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.swatches { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.sw {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0;
  box-shadow: inset 0 0 0 2px rgb(0 0 0 / .25);
}
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.sw.match { background: conic-gradient(from 0deg, #f5be0b, #c8102e, #1c4fd8, #1f5c45, #f5be0b); }
.custom { position: relative; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 2px dashed var(--muted); }
.custom input { position: absolute; inset: -8px; width: 52px; height: 52px; border: 0; padding: 0; cursor: pointer; opacity: 0; }
.custom::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--muted); pointer-events: none; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  border: 1px solid var(--line); background: var(--raised); border-radius: 9px; padding: 7px 12px; cursor: pointer; font-weight: 600;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.range { display: flex; align-items: center; gap: 10px; }
.range input { flex: 1; accent-color: var(--accent); }
.range output { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
.text-in {
  background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; text-transform: uppercase;
  font-weight: 700; letter-spacing: .08em; max-width: 260px;
}
.note { color: var(--muted); font-size: .82rem; margin: 0; }
@media (min-width: 900px) {
  .app { flex-direction: row; flex-wrap: wrap; }
  header { width: 100%; }
  .stage { flex: 1 1 0; height: calc(100dvh - 62px); }
  .panel { width: 380px; max-height: none; height: calc(100dvh - 62px); border-top: 0; border-left: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { .hint, .toast { transition: none; } }

function bodyTypeFor({ name, brand, year }) {
  const n = `${name} ${brand}`.toLowerCase();
  if (/\b(van|vans|transporter|transit|vito|sprinter|multivan|camper)\b/.test(n)) return "van";

  if ((year && year < 1972) || /(\bmm\b|testa rossa|spyder|spider|barchetta|cobra|\bace\b|\b[68]c\b|bialbero|giulietta|\b19[3-6]\d\b|healey|\btr[2-6]\b|\bmga\b|\b356\b)/.test(n)) return "classic";
  if (/(lamborghini|mclaren|bugatti|pagani|koenigsegg|rimac|enzo|laferrari|\bf40\b|\bf50\b|veyron|chiron|gt40|ford gt|zonda|huayra|aventador|countach|diablo|murci|revent|veneno|centenario|senna|\bp1\b|elva|valkyrie|svj|\bsto\b|huracán|huracan)/.test(n)) return "supercar";
  if (/(aston martin|bentley|maserati|jaguar|amg gt|\bsls\b|\bslr\b|\bm8\b|8 series|lexus lc|\b812\b|\b599\b|\b612\b|\bf12|\broma\b|portofino|california|gtc4|daytona|\b550\b|\b575\b|superfast|vanquish|\bdb[0-9]+|vantage|\bdbs\b|continental gt)/.test(n)) return "gt";
  return "coupe";
}
const typeKey = qs.get("type") || bodyTypeFor(car);

// ================= Body designs (all original, built from curves) =================
// x runs from the rear (-) to the nose (+). Heights in metres. w = half width.
const TYPES = {
  supercar: {

    // Low sharp nose, long straight rake from nose to roof, flat engine deck, high square tail.

  },

      topC: [[-2.35, 0.82], [-2.1, 0.88], [-1.4, 0.9], [-0.9, 0.88], [0.0, 0.86], [1.0, 0.84], [1.45, 0.82], [1.9, 0.72], [2.35, 0.5]],
      topS: [[-2.35, 0.82], [-2.0, 0.92], [-1.4, 0.99], [-0.9, 0.92], [0.0, 0.88], [1.0, 0.88], [1.45, 0.91], [1.95, 0.76], [2.35, 0.5]],

};
const T = TYPES[typeKey] || TYPES.coupe;
const XB = -T.L / 2, XN = T.L / 2;

// ================= Build settings =================
const BRAND_PAINT = {
  Ferrari: "#c8102e", Lamborghini: "#f5be0b", Porsche: "#b9bec5", McLaren: "#ff6a13", Bugatti: "#1c4fd8",
  "Leighton Vans": "#1c4fd8", "Aston Martin": "#1f5c45", Nissan: "#4a4f57", "Alfa Romeo": "#c8102e", Abarth: "#c8102e",
};
const DEFAULTS = {
  paint: BRAND_PAINT[car.brand] || "#c8102e", finish: "gloss",
  rimStyle: "five", rimColor: "#c9ccd1", wheelSize: 19, tyreText: "off",
  ride: 0, track: 0,
  spoiler: "none", splitter: false, skirts: false, vents: false, exhaust: "twin",
  livery: "none", stripeColor: "#f2f2f0", raceNo: "7",
  tint: 45, headlight: "#fff3d6", tailStyle: "twin", glow: "off",
  plate: "CAR GUY",
};
const STORE_KEY = "supercar-garage.builds.v1";
function loadAll() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
let state = { ...DEFAULTS, ...(loadAll()[car.id] || {}) };
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const all = loadAll(); all[car.id] = state; localStorage.setItem(STORE_KEY, JSON.stringify(all));
      const t = document.getElementById("toast"); t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 900);
    } catch {}
  }, 350);
}

// ================= Page text =================
document.getElementById("car-name").textContent = car.name;
document.getElementById("type-badge").textContent = `3D shape: ${T.label}`;
document.title = `${car.name} · Build Studio`;
if (inIOSApp) { document.getElementById("back").hidden = true; document.getElementById("shot").hidden = true; }
document.getElementById("back").addEventListener("click", (e) => {
  if (history.length > 1 && document.referrer.includes(location.host)) { e.preventDefault(); history.back(); }
});

// ================= Scene =================
const stage = document.getElementById("stage");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
} catch {
  stage.insertAdjacentHTML("beforeend", `<div class="error">Your browser can't show 3D graphics. Try Safari or Chrome on a newer device.</div>`);
  throw new Error("WebGL unavailable");
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f13);
scene.fog = new THREE.Fog(0x0d0f13, 11, 24);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(5.4, 2.1, 6.3);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.62, 0);
controls.enableDamping = true;
controls.minDistance = 3.6;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.49;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.addEventListener("start", () => { controls.autoRotate = false; document.getElementById("hint").style.opacity = 0; });

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a1c20, 0.45));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 7, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Smooth curve through [x, y] points (Catmull-Rom)

function makeBodySection(spec) {

// ================= Wheels =================
function buildWheel(rimMat, M) {
  const g = new THREE.Group();
  const r = T.r, tw = 0.26;
  const rr = r * (0.56 + (state.wheelSize - 17) * 0.05);
  // Rounded tyre
  const prof = [[rr * 0.98, -tw / 2 + 0.012], [r - 0.035, -tw / 2], [r - 0.006, -tw / 2 + 0.03], [r, -tw / 2 + 0.06], [r, tw / 2 - 0.06], [r - 0.006, tw / 2 - 0.03], [r - 0.035, tw / 2], [rr * 0.98, tw / 2 - 0.012]].map(([a, b]) => new THREE.Vector2(a, b));
  add(g, new THREE.LatheGeometry(prof, 56), M.tyre, { rx: Math.PI / 2 });

    const tex = canvasTex(1024, 1024, (gx, w, h) => {
      const s = (w / 2) / outer, rad = mid * s;

      gx.textAlign = "center"; gx.textBaseline = "middle";

      for (let i = 0; i < words.length; i++) { gx.save(); gx.rotate(i * step); gx.translate(0, -rad); gx.fillText(words[i], 0, 0); gx.restore(); }
    });
    add(g, new THREE.RingGeometry(inner, outer, 64), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.8 }), { z: tw / 2 + 0.003, shadow: false });
  }
  // Tread grooves
  for (const z of [-0.06, 0, 0.06]) add(g, new THREE.TorusGeometry(r - 0.001, 0.006, 4, 56), M.tread, { z, shadow: false });
  // Barrel, brake disc and caliper
  add(g, new THREE.CylinderGeometry(rr * 0.99, rr * 0.99, tw * 0.85, 40, 1, true), M.barrel, { rx: Math.PI / 2 });
  add(g, new THREE.CylinderGeometry(rr * 0.8, rr * 0.8, 0.028, 36), M.disc, { rx: Math.PI / 2, z: tw / 2 - 0.06 });
  for (let k = 0; k < 18; k++) { const a = (k / 18) * Math.PI * 2; add(g, box(0.004, rr * 0.3, 0.03, 0.001), M.discSlot, { x: Math.cos(a) * rr * 0.6, y: Math.sin(a) * rr * 0.6, z: tw / 2 - 0.06, rz: a + 0.4, shadow: false }); }
  add(g, box(0.12, rr * 0.62, 0.07, 0.025), M.caliper, { x: -rr * 0.58, y: rr * 0.28, z: tw / 2 - 0.035, rz: 0.45 });
  const face = tw / 2 + 0.006;
  add(g, new THREE.TorusGeometry(rr, 0.024, 12, 56), rimMat, { z: face });
  add(g, new THREE.CylinderGeometry(rr * 0.2, rr * 0.24, 0.06, 28), rimMat, { rx: Math.PI / 2, z: face });
  add(g, new THREE.CylinderGeometry(rr * 0.12, rr * 0.12, 0.02, 24), M.cap, { rx: Math.PI / 2, z: face + 0.032 });
  for (let k = 0; k < 5; k++) { const a = (k / 5) * Math.PI * 2 + 0.3; add(g, new THREE.CylinderGeometry(0.011, 0.011, 0.03, 6), M.chrome, { rx: Math.PI / 2, x: Math.cos(a) * rr * 0.155, y: Math.sin(a) * rr * 0.155, z: face + 0.03 }); }

    }

  // ---------- Livery: race number ----------
  if (state.livery === "number") {
    const no = String(state.raceNo || "").slice(0, 3);
    const tex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#f4f4f0"; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 4, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#111"; g.font = "bold 150px 'Arial Narrow', Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(no, w / 2, h / 2 + 8, 200);
    });
    const dx = (T.doors[0][0] + T.doors[0][1]) / 2, dy = T.van ? 1.0 : lerp(S.bot(dx), topY(S, dx), 0.5);
    const m = new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.4 });
    for (const side of [1, -1]) add(body, new THREE.CircleGeometry(0.22, 40), m, { x: dx, y: dy, z: side * (sideZ(S, dx, dy) + 0.004), ry: side > 0 ? 0 : Math.PI, shadow: false });
  }

  // ---------- Wheels (stay on the ground; the body moves with ride height) ----------
  for (const xw of T.wheels) for (const side of [1, -1]) {
    const zw = S.wf(xw) - 0.15 + state.track / 100;
    const w = buildWheel(rimMat, M); w.position.set(xw, T.r, side * zw); if (side < 0) w.rotation.y = Math.PI; carRoot.add(w);
  }

  // ---------- Underglow ----------
  if (state.glow !== "off") {
    const col = new THREE.Color(state.glow);
    const tex = canvasTex(256, 256, (g, w, h) => {
      const gr = g.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
      gr.addColorStop(0, `#${col.getHexString()}`); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    });
    add(carRoot, new THREE.PlaneGeometry(T.L * 1.25, 3.8), new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }), { rx: -Math.PI / 2, y: 0.008, shadow: false });
    const pl = new THREE.PointLight(col, 4, 4.5, 1.5); pl.position.set(0, 0.12, 0); carRoot.add(pl);
  }

  controls.target.y = Math.min(0.95, roofTop * 0.5 + 0.06);
}

// ================= Resize + render loop =================
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.position.setLength(w < 520 ? 9.4 : 8.4);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// ================= Controls panel =================
const PAINTS = [["Racing yellow", "#f5be0b"], ["Rosso red", "#c8102e"], ["Lava orange", "#ff6a13"], ["Lime", "#9bd21a"], ["British green", "#1f5c45"], ["Electric blue", "#1c4fd8"], ["Sky blue", "#5fb4ff"], ["Purple", "#6a2fc7"], ["Pink", "#ff4fa3"], ["White", "#f2f2f0"], ["Silver", "#b9bec5"], ["Gunmetal", "#4a4f57"], ["Black", "#0c0d10"]];
const RIMS = [["Silver", "#c9ccd1"], ["Gloss black", "#141518"], ["Gold", "#c8a24a"], ["Bronze", "#8c6a3e"], ["White", "#f2f2f0"], ["Red", "#c8102e"], ["Paint match", "paint"]];
const STRIPES = [["White", "#f2f2f0"], ["Black", "#0c0d10"], ["Yellow", "#f5be0b"], ["Red", "#c8102e"], ["Blue", "#1c4fd8"], ["Silver", "#b9bec5"]];
const HEADS = [["Warm white", "#fff3d6"], ["Ice blue", "#cfe6ff"], ["Yellow", "#ffd84a"]];
const GLOWS = [["Off", "off"], ["Yellow", "#f5be0b"], ["Blue", "#2f7bff"], ["Green", "#2bff88"], ["Purple", "#9b4dff"], ["Red", "#ff2b3a"]];

const sections = [
  ["Paint", [
    { type: "swatch", key: "paint", label: "Colour", options: PAINTS, custom: true },
    { type: "seg", key: "finish", label: "Finish", options: [["Gloss", "gloss"], ["Metallic", "metallic"], ["Matte", "matte"]] },
  ]],
  ["Wheels", [
    { type: "seg", key: "rimStyle", label: "Rim style", options: [["Split 5-spoke", "five"], ["Mesh", "mesh"], ["Turbine", "turbine"], ["Dish", "dish"]] },
    { type: "swatch", key: "rimColor", label: "Rim colour", options: RIMS },
    { type: "range", key: "wheelSize", label: "Wheel size", min: 17, max: 22, step: 1, fmt: (v) => `${v} inch` },
    { type: "seg", key: "tyreText", label: "Tyre lettering", options: [["Off", "off"], ["White", "#f2f2f0"], ["Yellow", "#f5be0b"]] },
  ]],
  ["Stance", [
    { type: "range", key: "ride", label: "Ride height", min: -8, max: 12, step: 1, fmt: (v) => (v === 0 ? "Stock" : v < 0 ? `Lowered ${-v} cm` : `Raised ${v} cm`) },
    { type: "range", key: "track", label: "Wheel poke", min: 0, max: 6, step: 1, fmt: (v) => (v === 0 ? "Flush" : `+${v} cm`) },
  ]],
  ["Body kit", [
    { type: "seg", key: "spoiler", label: "Rear spoiler", options: [["None", "none"], ["Lip", "lip"], ["Ducktail", "ducktail"], ["GT wing", "wing"]] },
    { type: "seg", key: "splitter", label: "Front splitter", options: [["Off", false], ["Carbon", true]] },
    { type: "seg", key: "skirts", label: "Side skirts", options: [["Off", false], ["Carbon", true]] },
    { type: "seg", key: "vents", label: "Bonnet vents", options: [["Off", false], ["On", true]] },
    { type: "seg", key: "exhaust", label: "Exhaust", options: [["Twin", "twin"], ["Quad", "quad"], ["Centre", "centre"], ["Hidden", "hidden"]] },
  ]],
  ["Livery", [
    { type: "seg", key: "livery", label: "Style", options: [["None", "none"], ["Racing stripes", "stripes"], ["Side stripe", "side"], ["Race number", "number"]] },
    { type: "swatch", key: "stripeColor", label: "Stripe colour", options: STRIPES },
    { type: "text", key: "raceNo", label: "Race number", max: 3, pattern: /[^0-9]/g },
  ]],
  ["Glass & lights", [
    { type: "range", key: "tint", label: "Window tint", min: 0, max: 100, step: 5, fmt: (v) => (v < 20 ? "Clear" : v < 60 ? `${v}%` : v < 90 ? `Dark ${v}%` : "Limo") },
    { type: "swatch", key: "headlight", label: "Headlights", options: HEADS },
    { type: "seg", key: "tailStyle", label: "Tail lights", options: [["Twin", "twin"], ["Light bar", "bar"]] },
    { type: "seg", key: "glow", label: "Underglow", options: GLOWS },
  ]],
  ["Plate", [
    { type: "text", key: "plate", label: "Number plate (up to 8)", max: 8, pattern: /[^A-Za-z0-9 ]/g },
    { type: "note", text: "Front plate is white and the rear is yellow, like real UK plates." },
  ]],
];

const tabsEl = document.getElementById("tabs"), groupsEl = document.getElementById("groups");
const renderers = [];
function set(k, value) { state[k] = value; build(); save(); renderers.forEach((fn) => fn()); }

sections.forEach(([name, fields], i) => {
  const tab = document.createElement("button");
  tab.className = "tab"; tab.type = "button"; tab.role = "tab"; tab.textContent = name; tab.id = `tab-${i}`;
  const group = document.createElement("div"); group.className = "group"; group.role = "tabpanel"; group.setAttribute("aria-labelledby", tab.id);
  tab.addEventListener("click", () => select(i));
  tabsEl.append(tab); groupsEl.append(group);

  for (const f of fields) {
    if (f.type === "note") { const p = document.createElement("p"); p.className = "note"; p.textContent = f.text; group.append(p); continue; }
    const wrap = document.createElement("div"); wrap.className = "field";
    const lab = document.createElement("span"); lab.textContent = f.label; wrap.append(lab);
    if (f.type === "swatch") {
      const row = document.createElement("div"); row.className = "swatches";
      for (const [n, v] of f.options) {
        const b = document.createElement("button"); b.type = "button"; b.className = "sw" + (v === "paint" ? " match" : "");
        if (v !== "paint") b.style.background = v; b.title = n; b.setAttribute("aria-label", n);
        b.addEventListener("click", () => set(f.key, v)); row.append(b);
        renderers.push(() => b.setAttribute("aria-pressed", String(state[f.key] === v)));
      }
      if (f.custom) {
        const c = document.createElement("label"); c.className = "custom"; c.title = "Any colour";
        const inp = document.createElement("input"); inp.type = "color"; inp.setAttribute("aria-label", "Pick any colour");
        inp.addEventListener("input", () => set(f.key, inp.value)); c.append(inp); row.append(c);
        renderers.push(() => { inp.value = /^#[0-9a-f]{6}$/i.test(state[f.key]) ? state[f.key] : "#c8102e"; });
      }
      wrap.append(row);
    } else if (f.type === "seg") {
      const row = document.createElement("div"); row.className = "seg";
      for (const [n, v] of f.options) {
        const b = document.createElement("button"); b.type = "button"; b.textContent = n;
        b.addEventListener("click", () => set(f.key, v)); row.append(b);
        renderers.push(() => b.setAttribute("aria-pressed", String(state[f.key] === v)));
      }
      wrap.append(row);
    } else if (f.type === "range") {
      const row = document.createElement("div"); row.className = "range";
      const inp = document.createElement("input"); inp.type = "range"; inp.min = f.min; inp.max = f.max; inp.step = f.step; inp.id = `r-${f.key}`;
      inp.setAttribute("aria-label", f.label);
      const out = document.createElement("output"); out.htmlFor = inp.id;
      inp.addEventListener("input", () => set(f.key, Number(inp.value)));
      row.append(inp, out); wrap.append(row);
      renderers.push(() => { inp.value = state[f.key]; out.textContent = f.fmt(state[f.key]); });
    } else if (f.type === "text") {
      const inp = document.createElement("input"); inp.className = "text-in"; inp.maxLength = f.max; inp.id = `t-${f.key}`;
      inp.setAttribute("aria-label", f.label); inp.autocomplete = "off"; inp.spellcheck = false;
      inp.addEventListener("input", () => { const v = inp.value.replace(f.pattern, "").toUpperCase(); if (v !== inp.value) inp.value = v; set(f.key, v); });
      wrap.append(inp);
      renderers.push(() => { if (document.activeElement !== inp) inp.value = state[f.key]; });
    }
    group.append(wrap);
  }
});
function select(i) {
  [...tabsEl.children].forEach((t, j) => t.setAttribute("aria-selected", String(i === j)));
  [...groupsEl.children].forEach((g, j) => g.classList.toggle("on", i === j));
}
select(0);

document.getElementById("reset").addEventListener("click", () => { state = { ...DEFAULTS }; build(); save(); renderers.forEach((fn) => fn()); });
document.getElementById("shot").addEventListener("click", () => {
  renderer.render(scene, camera);
  const a = document.createElement("a");
  a.href = renderer.domElement.toDataURL("image/png");
  a.download = `${car.name.replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-build.png`;
  document.body.append(a); a.click(); a.remove();
});

build();
renderers.forEach((fn) => fn());
resize();
window.__studio = { camera, controls, set, state: () => state };
</script>
</body>
</html>
